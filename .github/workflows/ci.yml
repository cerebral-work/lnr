name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · compile-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (≥ v2.2.0 — Node 20 left the runners 2026-06-02)
        with:
          bun-version: 1.3.14
        # setup-bun v2 caches ~/.bun/install/cache automatically keyed on
        # bun.lock hash — no explicit cache step needed.

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          # Enables the read-only live-API contract tests (test/live-contract.test.ts);
          # they self-skip when the secret is absent (e.g. forks).
          LNR_LIVE_CONTRACT_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # Capture the ONE full-suite run for the next step. The default run shell
          # is `bash -e` WITHOUT pipefail, so set it: otherwise tee's exit status
          # hides a failing test and the step goes green.
          set -o pipefail
          bun test 2>&1 | tee "${RUNNER_TEMP}/bun-test.log"

      - name: Verify live-contract tests ran (not skipped)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          LNR_LIVE_CONTRACT_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "${LNR_LIVE_CONTRACT_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY secret is not set (exposed to tests as LNR_LIVE_CONTRACT_KEY) — live-contract tests are silently skipping on every CI run."
            echo "::warning::The read-only contract tests verify the GraphQL schema hasn't drifted. Without them, schema changes surface as runtime surprises."
            echo "::warning::To fix: add the LINEAR_API_KEY secret to the repo (Settings → Secrets → Actions)."
            exit 1
          fi
          # The full Test step already ran the live suite. Verify that same run
          # executed all four contracts instead of issuing a second API burst.
          live_passes=$(grep -c "(pass) live API contract" "${RUNNER_TEMP}/bun-test.log" || true)
          if [ "${live_passes}" -ne 4 ]; then
            echo "::error::Expected 4 live-contract passes in the full test run; found ${live_passes}."
            exit 1
          fi
          echo "Verified ${live_passes} live Linear API contracts in the full test run."

      # Compile + run the real binary so a compile or module-load/bundling failure
      # is caught at PR time (the @linear/sdk import executes at startup). The SDK
      # client can't trip bun#11785 (no schema realm checks), so that is not what
      # this guards — see docs/decisions.md ADR-0001.
      - name: Compile smoke
        run: |
          bun run build
          ./dist/lnr --version
          ./dist/linearctl --version
          ./dist/lnr examples comment > "${RUNNER_TEMP}/lnr-example.sh"
          bash -n "${RUNNER_TEMP}/lnr-example.sh"
          grep -q -- "--body -" "${RUNNER_TEMP}/lnr-example.sh"
          status=0
          ./dist/lnr bogus --help > "${RUNNER_TEMP}/unknown-help.out" 2> "${RUNNER_TEMP}/unknown-help.err" || status=$?
          test "$status" -eq 2
          test ! -s "${RUNNER_TEMP}/unknown-help.out"
          grep -q "unknown command 'bogus'" "${RUNNER_TEMP}/unknown-help.err"

  rust:
    name: rust · fmt · clippy · test · deny
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (-j 2)
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings

      - name: Test (-j 2)
        run: |
          cargo test --workspace --locked -j 2
          cargo test --doc --workspace --locked -j 2

      - name: Cargo deny
        run: cargo deny check

      - name: Spec & toolchain checks (-j 2)
        run: |
          cargo run -q -p xtask --locked -j 2 -- spec-check
          cargo run -q -p xtask --locked -j 2 -- toolchain-check

  # The estate build entrypoint (xtask contract v1): `cargo xtask ci` runs
  # tools, toolchain-check, fmt-check, clippy, test, doc-test, deny, typos,
  # machete and bun (the TypeScript CLI), stops at the first failure and
  # prints one summary line per step.
  # Added next to the jobs above; it replaces none of them.
  xtask-ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Same nextest profile as `make ci`.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # `cargo xtask ci` ends with the `bun` step (the TypeScript CLI).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (≥ v2.2.0 — Node 20 left the runners 2026-06-02)
        with:
          bun-version: 1.3.14
      # `cargo xtask tools` installs the pinned gate tools with `cargo install`.
      # Give it a writable CARGO_HOME whose bin directory is on PATH, so the
      # tools it installs are the ones the later steps run.
      - name: writable CARGO_HOME
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask-ci
          # Only main writes the cache (including the installed tools); PRs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: cargo xtask ci
        run: cargo xtask ci
