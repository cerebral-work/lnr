name: Build image

# Image build and chart publish for the in-cluster linearctl operator, with
# stock actions, in this repo:
#   1. build the Dockerfile in a rootless BuildKit Job in ci-builds (rendered from
#      the published image-build chart) and push to Harbor;
#   2. block on a Trivy HIGH/CRITICAL scan of the pushed digest;
#   3. sign that digest with the estate cosign key (the key Kyverno's
#      verify-image-signatures trusts) and verify the signature;
#   4. publish deploy/chart to Harbor OCI, once per chart version.
#
# This replaces the cross-repo dispatch to unsigned-paas
# build-linearctl-image.yaml (operator ruling 2026-10-07, CER-2647).
#
# The job runs on an in-cluster runner: Harbor has no public route, and those
# runners have no Docker daemon, so nothing builds on the runner itself.
#
# Secrets: KUBECONFIG_CI_BUILDS (ci-builds namespace), RELEASE_BOT_APP_ID (variable)
# and RELEASE_BOT_PRIVATE_KEY (clone token),
# HARBOR_PUSH_USERNAME/PASSWORD (platform project push robot),
# HARBOR_HELM_PUSH_USERNAME/PASSWORD (helm-charts push robot),
# COSIGN_PRIVATE_KEY/COSIGN_PASSWORD (estate signing key).
# This repo is PUBLIC. The workflow never runs on pull_request, so the secrets
# are never available in a context a fork can influence.
#
# Size: the compiled binary is ~37 MB gzipped, under Cloudflare's ~100 MB body
# cap on harbor.unsigned.gg (OPS-810). A layer above the cap gets HTTP 413.
#
# Publishing is not deploying: the ArgoCD pin bump in unsigned-paas gitops/ is
# a separate, operator-gated PR.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "examples/**"
      - ".linearctl/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "Dockerfile"
      - "deploy/chart/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-linearctl-image
  cancel-in-progress: false

env:
  REGISTRY: harbor.unsigned.gg
  IMAGE: harbor.unsigned.gg/platform/linearctl
  CHART_REPO: oci://harbor.unsigned.gg/helm-charts
  BUILD_NAMESPACE: ci-builds
  IMAGE_BUILD_CHART_VERSION: 0.2.1

jobs:
  build:
    name: Build, scan, sign, publish
    runs-on: {group: ent-default, labels: [self-hosted]}
    timeout-minutes: 90
    steps:
      - uses: unsigned-gg/actions/vendor/actions-checkout@fd981ada61381db6416ba67b2bbd2d779823d0b5 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail naming every missing secret
        env:
          KUBECONFIG_CI_BUILDS: ${{ secrets.KUBECONFIG_CI_BUILDS }}
          RELEASE_BOT_APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          HARBOR_PUSH_USERNAME: ${{ secrets.HARBOR_PUSH_USERNAME }}
          HARBOR_PUSH_PASSWORD: ${{ secrets.HARBOR_PUSH_PASSWORD }}
          HARBOR_HELM_PUSH_USERNAME: ${{ secrets.HARBOR_HELM_PUSH_USERNAME }}
          HARBOR_HELM_PUSH_PASSWORD: ${{ secrets.HARBOR_HELM_PUSH_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for n in KUBECONFIG_CI_BUILDS RELEASE_BOT_APP_ID RELEASE_BOT_PRIVATE_KEY HARBOR_PUSH_USERNAME HARBOR_PUSH_PASSWORD \
                   HARBOR_HELM_PUSH_USERNAME HARBOR_HELM_PUSH_PASSWORD COSIGN_PRIVATE_KEY COSIGN_PASSWORD; do
            [ -n "${!n:-}" ] || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::missing secrets or variables:$missing"; exit 1; }

      - name: Install the pinned tools
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          inst() { # name url sha256 [archive member]
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.dl" "$2"
            echo "$3  $RUNNER_TEMP/$1.dl" | sha256sum -c -
            if [ -n "${4:-}" ]; then tar -xzf "$RUNNER_TEMP/$1.dl" -C "$RUNNER_TEMP" "$4" && mv "$RUNNER_TEMP/$4" "$bin/$1"; else mv "$RUNNER_TEMP/$1.dl" "$bin/$1"; fi
            chmod +x "$bin/$1"
          }
          inst crane https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230 crane
          inst cosign https://github.com/sigstore/cosign/releases/download/v2.6.1/cosign-linux-amd64 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a
          inst trivy https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 trivy
          inst helm https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179 linux-amd64/helm
          inst kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3
          echo "$bin" >> "$GITHUB_PATH"

      - name: Resolve tag + chart version, log in to Harbor
        id: params
        env:
          PUSH_USER: ${{ secrets.HARBOR_PUSH_USERNAME }}
          PUSH_PASS: ${{ secrets.HARBOR_PUSH_PASSWORD }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          chart_version="$(awk '/^version:/{gsub(/["'"'"']/,"",$2); print $2; exit}' deploy/chart/Chart.yaml)"
          [ -n "${chart_version}" ] || { echo "::error::failed to read version from deploy/chart/Chart.yaml"; exit 1; }
          {
            echo "tag=git-${short_sha}"
            echo "short=${short_sha}"
            echo "chart_version=${chart_version}"
          } >> "${GITHUB_OUTPUT}"
          dc="$RUNNER_TEMP/docker"; mkdir -p "$dc"
          printf '%s' "$PUSH_PASS" | DOCKER_CONFIG="$dc" crane auth login "$REGISTRY" -u "$PUSH_USER" --password-stdin
          echo "DOCKER_CONFIG=$dc" >> "$GITHUB_ENV"

      - name: Mint the clone token (contents read only, on this repository)
        id: clone
        uses: unsigned-gg/actions/vendor/actions-create-github-app-token@fd981ada61381db6416ba67b2bbd2d779823d0b5 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Stage the clone token in ci-builds
        env:
          KCFG: ${{ secrets.KUBECONFIG_CI_BUILDS }}
          TOKEN: ${{ steps.clone.outputs.token }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"; printf '%s' "$KCFG" > "$RUNNER_TEMP/kubeconfig"
          secret="build-git-$GITHUB_RUN_ID"
          { echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig"; echo "CLONE_SECRET=$secret"; } >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n "$BUILD_NAMESPACE" delete secret "$secret" --ignore-not-found
          printf '%s' "$TOKEN" | kubectl -n "$BUILD_NAMESPACE" create secret generic "$secret" --from-file=git-token=/dev/stdin

      - name: Build image in a BuildKit Job
        env:
          HELM_USER: ${{ secrets.HARBOR_HELM_PUSH_USERNAME }}
          HELM_PASS: ${{ secrets.HARBOR_HELM_PUSH_PASSWORD }}
          REPO: ${{ github.repository }}
          SHORT: ${{ steps.params.outputs.short }}
        run: |
          set -euo pipefail
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          echo "HELM_REGISTRY_CONFIG=$HELM_REGISTRY_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$HELM_PASS" | helm registry login "$REGISTRY" -u "$HELM_USER" --password-stdin
          # Push through the in-cluster Traefik service, not the Cloudflare edge (same as revenant).
          ip=$(getent hosts traefik.traefik.svc.cluster.local | awk '{print $1; exit}')
          [ -n "$ip" ] || { echo "::error::cannot resolve traefik.traefik.svc.cluster.local"; exit 1; }
          job="image-build-linearctl-$SHORT"
          helm template image-build "oci://$REGISTRY/helm-charts/image-build" --version "$IMAGE_BUILD_CHART_VERSION" \
            --show-only templates/job.yaml \
            --set build.enabled=true --set build.name="linearctl-$SHORT" --set build.registryRoute.ip="$ip" \
            --set build.git.repository="https://github.com/$REPO.git" --set build.git.revision="$GITHUB_SHA" \
            --set build.git.credentialsSecret="$CLONE_SECRET" --set build.dockerfile="Dockerfile" \
            --set build.cache.ref="$REGISTRY/platform/buildkit-cache:linearctl" \
            --set "build.destinations[0]=$IMAGE:git-$SHORT" \
            --set build.activeDeadlineSeconds=3600 > "$RUNNER_TEMP/linearctl.yaml"
          kubectl -n "$BUILD_NAMESPACE" delete "job/$job" --ignore-not-found --cascade=foreground --timeout=120s
          kubectl -n "$BUILD_NAMESPACE" create -f "$RUNNER_TEMP/linearctl.yaml"
          state=pending
          for _ in $(seq 1 260); do
            s=$(kubectl -n "$BUILD_NAMESPACE" get "job/$job" -o jsonpath='{.status.succeeded}/{.status.failed}') || s=""
            case "$s" in 1/*) state=ok; break ;; */[1-9]*) state=failed; break ;; esac
            sleep 15
          done
          kubectl -n "$BUILD_NAMESPACE" logs "job/$job" --all-containers --tail=100 || true
          [ "$state" = ok ] || { echo "::error::BuildKit Job $job ended in state $state"; exit 1; }

      - name: Read the pushed digest
        id: build
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          dig=$(crane digest "$IMAGE:$TAG")
          [[ "$dig" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$IMAGE:$TAG has no digest"; exit 1; }
          echo "digest=$dig" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (blocking, HIGH/CRITICAL)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ secrets.HARBOR_PUSH_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PUSH_PASSWORD }}
        run: |
          set -euo pipefail
          env -u COSIGN_PASSWORD trivy image -q --format table --severity HIGH,CRITICAL --exit-code 1 "${IMAGE}@${DIGEST}"

      - name: Sign and verify by digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          # --tlog-upload=false keeps private-registry refs out of the public
          # Rekor log (estate rule), so verify with --insecure-ignore-tlog.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${ref}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "${RUNNER_TEMP}/cosign.pub"
          cosign verify --key "${RUNNER_TEMP}/cosign.pub" --insecure-ignore-tlog "${ref}" > /dev/null
          echo "Signed and verified ${ref}"

      - name: Publish chart (once per version)
        env:
          HELM_PUSH_USERNAME: ${{ secrets.HARBOR_HELM_PUSH_USERNAME }}
          HELM_PUSH_PASSWORD: ${{ secrets.HARBOR_HELM_PUSH_PASSWORD }}
          CHART_VERSION: ${{ steps.params.outputs.chart_version }}
        run: |
          set -euo pipefail
          printf '%s' "${HELM_PUSH_PASSWORD}" \
            | helm registry login "${REGISTRY}" --username "${HELM_PUSH_USERNAME}" --password-stdin
          # A chart version is published once. Rebuilds of the same version do
          # not overwrite it; bump deploy/chart/Chart.yaml to publish a change.
          if helm show chart "${CHART_REPO}/linearctl" --version "${CHART_VERSION}" > /dev/null 2>&1; then
            echo "::notice::chart linearctl ${CHART_VERSION} is already in Harbor; not republished"
            exit 0
          fi
          helm package deploy/chart -d "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/linearctl-${CHART_VERSION}.tgz" "${CHART_REPO}"

      - name: Summary
        env:
          TAG: ${{ steps.params.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHART_VERSION: ${{ steps.params.outputs.chart_version }}
        run: |
          {
            echo "### linearctl image"
            echo "- image: \`${IMAGE}:${TAG}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- chart: \`${CHART_REPO}/linearctl:${CHART_VERSION}\`"
            echo
            echo "Publishing is not deploying. The ArgoCD pin bump is a separate, operator-gated PR."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up credentials
        if: always()
        run: |
          if [ -n "${CLONE_SECRET:-}" ] && ! KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl -n "$BUILD_NAMESPACE" delete secret "$CLONE_SECRET" --ignore-not-found; then
            echo "::warning::clone Secret $CLONE_SECRET was not deleted from $BUILD_NAMESPACE; its token expires within one hour"
          fi
          rm -rf "$RUNNER_TEMP/docker" "$RUNNER_TEMP/helm-registry.json" "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/cosign.pub" "$RUNNER_TEMP/chart" || true
